<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-label="通信与计算重叠：一组头计算时下一组头在传输">
<style>
text{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC',Helvetica,Arial,sans-serif;fill:#e8edf5;font-size:13px}.m{fill:#7f93b5;font-size:12px}
.c{fill:#3b82f6}.x{fill:#a78bfa}
.sweep{animation:sw 5s linear infinite}@keyframes sw{from{transform:translateX(0)}to{transform:translateX(640px)}}
</style>
<rect width="900" height="300" rx="18" fill="#050914"/>
<text x="40" y="42" style="font-size:19px;font-weight:700">多卡协作：别让显卡等数据</text>
<text x="40" y="64" class="m">先按 token 分工，再按注意力头分工；一组头计算时，下一组头已在路上</text>
<text x="40" y="118">没有重叠</text>
<g><rect class="c" x="150" y="100" width="130" height="26" rx="5"/><rect class="x" x="280" y="100" width="90" height="26" rx="5"/><rect class="c" x="370" y="100" width="130" height="26" rx="5"/><rect class="x" x="500" y="100" width="90" height="26" rx="5"/></g>
<text x="40" y="188">通信 / 计算重叠</text>
<g><rect class="c" x="150" y="170" width="130" height="26" rx="5"/><rect class="c" x="280" y="170" width="130" height="26" rx="5"/><rect class="c" x="410" y="170" width="130" height="26" rx="5"/>
<rect class="x" x="190" y="204" width="90" height="16" rx="5" opacity=".9"/><rect class="x" x="320" y="204" width="90" height="16" rx="5" opacity=".9"/></g>
<line class="sweep" x1="150" y1="84" x2="150" y2="230" stroke="#22d3ee" stroke-width="2"/>
<rect x="640" y="250" width="12" height="12" class="c"/><text x="658" y="261">计算</text><rect x="710" y="250" width="12" height="12" class="x"/><text x="728" y="261">通信</text>
<text x="40" y="262" style="fill:#22d3ee;font-weight:700">四卡长序列实测约 7%；八卡 1,570 → 937 ms（1.67×）</text>
</svg>
