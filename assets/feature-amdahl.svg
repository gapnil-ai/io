<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-label="注意力快十倍，整体只快 1.37 倍">
<style>
text{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC',Helvetica,Arial,sans-serif;fill:#e8edf5;font-size:14px}.m{fill:#7f93b5;font-size:12px}
.att{transform-box:fill-box;transform-origin:left;animation:sh 7s ease-in-out infinite}
@keyframes sh{0%,20%{transform:scaleX(1)}45%,85%{transform:scaleX(.1)}100%{transform:scaleX(1)}}
.n{animation:nn 7s infinite}@keyframes nn{0%,30%{opacity:0}48%,85%{opacity:1}100%{opacity:0}}
</style>
<rect width="900" height="300" rx="18" fill="#050914"/>
<text x="40" y="42" style="font-size:19px;font-weight:700">先找瓶颈：局部快 10 倍，整体只快 1.37 倍</text>
<text x="40" y="64" class="m">整体加速比 = 1 / [(1 − p) + p / a] · p = 30%，a = 10</text>
<text x="40" y="124">优化前</text>
<rect x="120" y="104" width="720" height="30" rx="6" fill="#0d1a33"/>
<rect x="120" y="104" width="216" height="30" rx="6" fill="#a78bfa"/>
<text x="130" y="124" style="fill:#050914;font-weight:700">注意力 30%</text><text x="560" y="124" class="m">其余 70%（矩阵乘 / 通信 / 解码 / 封装）</text>
<text x="40" y="204">优化后</text>
<rect x="120" y="184" width="720" height="30" rx="6" fill="#0d1a33"/>
<rect class="att" x="120" y="184" height="30" rx="4" fill="#a78bfa" width="216"/>
<rect x="120" y="184" width="0" height="0"/>
<g class="n"><text x="150" y="204">3%</text><text x="560" y="204" class="m">总耗时变成 73%</text></g>
<text x="40" y="262" style="fill:#22d3ee;font-size:16px;font-weight:700">瓶颈会转移 —— 注意力之后，轮到逐元素、通信、解码、封装。</text>
</svg>
