<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="900" height="340" role="img" aria-label="Gapnil 视频生成流水线：文本编码、重复去噪、解码、封装；交付一条成片从 226.2 秒降到 6.96 秒">
<style>
text{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC',Helvetica,Arial,sans-serif;fill:#e8edf5}
.s{fill:#0a1224;stroke:#16294a;stroke-width:1.5}
.d{fill:#0d1a33;stroke:#3b82f6;stroke-width:2}
.t{font-size:15px;text-anchor:middle;font-weight:600}
.u{font-size:11.5px;text-anchor:middle;fill:#7f93b5}
.ring{fill:none;stroke:#3b82f6;stroke-width:3;stroke-linecap:round;stroke-dasharray:60 140;transform-origin:450px 140px;animation:spin 2.2s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.a{animation:fa 9s infinite}.b{animation:fb 9s infinite}
@keyframes fa{0%,12%{opacity:0}18%,92%{opacity:1}100%{opacity:0}}
@keyframes fb{0%,56%{opacity:0}62%,92%{opacity:1}100%{opacity:0}}
.bar1{transform-box:fill-box;transform-origin:left;animation:w1 9s infinite}
@keyframes w1{0%,3%{transform:scaleX(0)}14%,92%{transform:scaleX(1)}100%{transform:scaleX(0)}}
.bar2{transform-box:fill-box;transform-origin:left;animation:w2 9s infinite}
@keyframes w2{0%,45%{transform:scaleX(0)}58%,92%{transform:scaleX(1)}100%{transform:scaleX(0)}}
.flow{stroke-dasharray:6 6;animation:dash 1s linear infinite}
@keyframes dash{to{stroke-dashoffset:-12}}
</style>
<rect width="900" height="340" rx="18" fill="#050914"/>
<text x="450" y="38" class="t" style="font-size:19px">Gapnil 引擎：一句提示词 → 带声音的视频</text>
<text x="450" y="58" class="u">优化不是只让一个算子变快，而是少算、快算、并行，以及少搬、少等</text>
<g stroke="#3b82f6" stroke-width="2" fill="none" class="flow" opacity=".7">
<path d="M150 140H200"/><path d="M290 140H345"/><path d="M555 140H610"/><path d="M700 140H745"/></g>
<rect class="s" x="60" y="110" width="90" height="60" rx="12"/><text x="105" y="136" class="t">提示词</text><text x="105" y="155" class="u">Prompt</text>
<rect class="s" x="200" y="110" width="90" height="60" rx="12"/><text x="245" y="136" class="t">文本编码</text><text x="245" y="155" class="u">Encoder</text>
<rect class="d" x="345" y="90" width="210" height="100" rx="16"/>
<rect x="352" y="97" width="196" height="86" rx="12" fill="none" stroke="#3b82f6" stroke-width="3" stroke-dasharray="60 400" stroke-linecap="round"><animate attributeName="stroke-dashoffset" from="0" to="-920" dur="2.2s" repeatCount="indefinite"/></rect>
<text x="450" y="132" class="t" style="font-size:17px">重复去噪 DiT</text>
<text x="450" y="154" class="u">49 次 → 3 次 · 每次更快</text>
<text x="450" y="172" class="u">NVFP4 · Sol-Attn · 8 卡并行</text>
<rect class="s" x="610" y="110" width="90" height="60" rx="12"/><text x="655" y="136" class="t">VAE 解码</text><text x="655" y="155" class="u">分块并行</text>
<rect class="s" x="745" y="110" width="100" height="60" rx="12"/><text x="795" y="136" class="t">硬件封装</text><text x="795" y="155" class="u">NVENC · MP4</text>
<circle r="6" fill="#22d3ee"><animateMotion dur="4s" repeatCount="indefinite" path="M60 140H450H845"/></circle>
<text x="60" y="236" style="font-size:13px;fill:#7f93b5" >交付一条 5.17 秒成片</text>
<rect x="60" y="248" width="760" height="22" rx="11" fill="#0a1224"/>
<rect class="bar1" x="60" y="248" height="22" rx="11" fill="#5b6b8a" width="760"/>
<text class="a" x="68" y="264" style="font-size:12.5px">226.2 s · 起点：单卡，49 步完整模式</text>
<rect x="60" y="290" width="760" height="22" rx="11" fill="#0a1224"/>
<rect class="bar2" x="60" y="290" height="22" rx="11" fill="#22d3ee" width="24"/>
<text class="b" x="96" y="306" style="font-size:12.5px">6.96 s · 线上 7 卡 3 步 · 32.5×</text>
</svg>
